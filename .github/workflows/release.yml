name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the jobs that publish get write access.
permissions:
  contents: read

jobs:
  # Nothing is built or published until the tag, VERSION and the plugin
  # manifests agree and the tests and eval gates pass on the tagged commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Tag, VERSION and manifests agree
        run: go run ./cmd/version-sync --check --tag "$GITHUB_REF_NAME"

      - name: Test
        run: go test -tags sqlite_fts5 -count=1 ./...

      - name: Eval gates
        run: make eval

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      # Linux binaries are compiled with zig cc pinned to glibc 2.31 so they
      # run on older distros (Ubuntu 20.04 / Debian 11, common under WSL).
      # Building on ubuntu-latest's native gcc links against its current
      # glibc and the binary refuses to start there ("GLIBC_2.34 not found").
      - name: Install C cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          sudo tar xJf /tmp/zig.tar.xz -C /opt
          sudo mv /opt/zig-linux-x86_64-0.13.0 /opt/zig
          printf '#!/bin/sh\nexec /opt/zig/zig cc -target x86_64-linux-gnu.2.31 "$@"\n' | sudo tee /usr/local/bin/zcc-amd64 >/dev/null
          printf '#!/bin/sh\nexec /opt/zig/zig cc -target aarch64-linux-gnu.2.31 "$@"\n' | sudo tee /usr/local/bin/zcc-arm64 >/dev/null
          sudo chmod +x /usr/local/bin/zcc-amd64 /usr/local/bin/zcc-arm64

      - name: Verify glibc baseline of the amd64 binary
        run: |
          CGO_ENABLED=1 CC=zcc-amd64 \
            go build -tags sqlite_fts5 -o /tmp/anchored-glibc-check ./cmd/anchored
          MAX=$(objdump -T /tmp/anchored-glibc-check | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "max glibc symbol: $MAX"
          case "$MAX" in
            GLIBC_2.3[2-9]*|GLIBC_2.[4-9]*) echo "binary requires $MAX (> 2.31)"; exit 1 ;;
          esac

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          GOOS: darwin
        run: |
          go build -tags 'sqlite_fts5' \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o anchored ./cmd/anchored

      - name: Create archive
        run: |
          # The sidecar is how darwin gets a published digest at all: this job
          # runs in parallel with GoReleaser, which owns checksums.txt and
          # only digests what it builds. `anchored self-update` falls back to
          # this file, so it is required, not decorative.
          ARCHIVE="anchored_${{ steps.version.outputs.VERSION }}_darwin_${{ matrix.goarch }}.tar.gz"
          tar czf "$ARCHIVE" anchored
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
